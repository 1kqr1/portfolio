<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Portfolio</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

  <!-- ログイン画面 -->
  <div class="login-screen" id="login-screen">
    <div class="login-card">
      <h1 style="color: var(--accent);">NEON ADMIN</h1>
      <p style="color: var(--text-soft); margin-bottom: 24px;">サイトデータを管理します</p>
      <div class="login-error" id="login-error">パスワードが違います</div>
      <form id="login-form">
        <input type="password" id="login-password" class="form-input" placeholder="パスワード(admin)" required />
        <button type="submit" class="btn btn-primary" style="width: 100%;">LOGIN</button>
      </form>
    </div>
  </div>

  <!-- ダッシュボード -->
  <div class="dashboard" id="dashboard">
    <header class="admin-header">
      <h2 style="margin:0; color: var(--accent);">DATA EDITOR</h2>
      <div style="display: flex; gap: 8px;">
        <button class="btn" id="btn-preview">👁 Preview</button>
        <button class="btn btn-danger" id="btn-logout">Logout</button>
      </div>
    </header>

    <div class="toolbar">
      <button class="btn btn-primary" id="btn-save">💾 保存</button>
      <button class="btn" id="btn-export">📤 バックアップDL</button>
      <button class="btn" id="btn-import">📥 データ読込</button>
      <button class="btn" id="btn-export-js">📄 data.js生成 (GitHub用)</button>
      <button class="btn btn-danger" id="btn-reset">🔄 初期化</button>
    </div>

    <div class="editor-container">
      <p style="color: var(--text-soft); font-size: 14px; margin: 0;">
        ポートフォリオの全データ（プロフィール、経歴、スキル、作品）をJSON形式で直接編集できます。編集後は「保存」を押してください。
      </p>
      <textarea id="json-editor" class="json-editor" spellcheck="false"></textarea>
    </div>
  </div>

  <!-- コード出力モーダル -->
  <div class="modal-overlay" id="code-modal">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px;">
        <h3 style="margin:0;">data.js コード出力</h3>
        <button class="btn" onclick="window.closeModal('code-modal')" style="padding:4px 8px;">×</button>
      </div>
      <p style="font-size: 14px; color: var(--text-soft);">
        このコードをコピーして <code>js/data.js</code> の中身を上書きすると、GitHub Pagesなどへのデプロイ準備が完了します。
      </p>
      <pre class="code-block" id="code-output"></pre>
      <button class="btn btn-primary" style="margin-top: 16px;" onclick="navigator.clipboard.writeText(document.getElementById('code-output').textContent).then(() => { this.textContent = 'Copied!'; setTimeout(() => { this.textContent = '📋 Copy'; }, 2000); })">
        📋 Copy
      </button>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
