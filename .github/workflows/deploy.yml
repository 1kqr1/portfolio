name: Deploy to GitHub Pages

# 静的エクスポート（output: 'export'）した out/ を GitHub Pages に配信する。
#
# 注意: このワークフローを有効にするには、リポジトリ設定で
#   Settings > Pages > Build and deployment > Source を
#   「Deploy from a branch」から「GitHub Actions」に変更する必要がある。
#   （現状は branch のルートを直接配信する legacy 設定になっている）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を避ける（進行中のデプロイはキャンセルしない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # GitHub Pages は https://1kqr1.github.io/portfolio/ というサブパス配信のため
        # basePath が要る。Cloudflare Pages 側はルート配信なので設定しない。
        env:
          NEXT_PUBLIC_BASE_PATH: /portfolio
        run: npm run build

      - name: Disable Jekyll
        # _next ディレクトリが Jekyll に無視されるのを防ぐ
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
